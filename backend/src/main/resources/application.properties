spring.application.name=pesquisaOrdenacao

# Railway (e plataformas parecidas) informam a porta na variável PORT; localmente usa 8080.
server.port=${PORT:8080}

# Quantidade máxima de elementos por execução. Cada passo guarda uma cópia do array,
# então o tamanho da resposta cresce aproximadamente com n³ nos algoritmos O(n²):
# com 256 elementos o Bubble Sort invertido respondia ~71 MB; com 64, ~1 MB.
sorting.max-array-size=64

# Tabela de tempos (POST /api/benchmarks): maior N aceito e mínimo de execuções por célula (usa-se a mediana).
benchmark.max-size=4096
benchmark.min-runs=5

# Tamanho máximo do corpo das requisições em /api/** (em bytes).
app.max-request-size-bytes=16384

# Origens do frontend autorizadas (separadas por vírgula). Aceita curinga no subdomínio, útil para os
# deploys de preview do Cloudflare Pages: https://*.meu-projeto.pages.dev
# Em produção, sobrescreva com a variável de ambiente APP_CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Rejeita valores decimais em vez de truncá-los silenciosamente (ex.: 1.5 → 1).
spring.jackson.deserialization.accept-float-as-int=false

server.error.include-stacktrace=never
